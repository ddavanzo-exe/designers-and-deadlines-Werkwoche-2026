<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D&amp;D: Designers &amp; Deadlines – Game Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --board:#151829; --board2:#1F2338; --board3:#2A2F4A; --ink:#EEF0FA; --muted:#A6ABC8; --card:#FFFFFF; --cardink:#171A2B; --cardmuted:#5D6278;
  --designer:#7B61FF; --designer-soft:#EEEAFF; --museum:#14A3A5; --museum-soft:#DDF4F3;
  --deadline:#FFB020; --bad:#E5344B; --bad-soft:#FDE6E9; --good:#3DBE7E;
  --font:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0; background:var(--board); color:var(--ink); font-family:var(--font); display:flex; flex-direction:column; overflow:hidden}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--deadline); outline-offset:2px}
[hidden]{display:none !important}

.top{display:flex; align-items:center; gap:14px; padding:10px 22px; background:var(--board2)}
.logo{font-weight:800; font-size:20px; letter-spacing:-.02em; margin-right:auto}
.logo span{font-weight:500; color:var(--muted); font-size:14px; margin-left:8px}
.top .clock{font-variant-numeric:tabular-nums; color:var(--muted); font-size:15px; border:1px solid var(--board3); padding:5px 12px; border-radius:999px; background:transparent}
.phase-name{font-weight:700; color:var(--deadline); font-size:15px}
.tbar{height:8px; background:var(--board2)}
.tbar i{display:block; height:100%; background:var(--deadline); transform-origin:left; transform:scaleX(0); transition:transform .25s linear}
.tbar.hot i{background:var(--bad)}

.stage{flex:1; min-height:0; overflow:auto; padding:clamp(14px,2.2vw,40px) clamp(16px,3.6vw,64px); font-size:clamp(13px, .68vw + .68vh, 25px)}
.head{display:flex; gap:1em; align-items:flex-start; margin-bottom:1em}
.head h1{font-size:2.6em; line-height:1; letter-spacing:-.03em; margin:0; font-weight:800}
.head p{margin:.35em 0 0; color:var(--muted); font-size:1.08em; max-width:46em}
.when{margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; padding-top:.4em; white-space:nowrap}
.timer{margin-left:auto; background:var(--deadline); color:var(--cardink); border-radius:16px; padding:.3em .7em .35em; text-align:right; min-width:5.6em}
.timer b{display:block; font-size:3.3em; line-height:1; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.timer span{font-size:.8em; font-weight:700}
.timer.hot,.timer.done{background:var(--bad); color:#fff}
@media (prefers-reduced-motion:no-preference){ .timer.hot{animation:beat 1s ease-in-out infinite} }
@keyframes beat{50%{transform:scale(1.05)}}

.g{display:grid; gap:.7em}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){ .g5,.g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:1fr} body{overflow:auto} }
.card{background:var(--card); color:var(--cardink); border-radius:10px; padding:.75em .85em}
.muted{color:var(--cardmuted)}
.tag{display:inline-block; border-radius:999px; padding:.08em .6em; font-size:.8em; font-weight:700; color:#fff; margin:0 .25em .25em 0}
.ch-loc{background:#9A6412} .ch-dig{background:#1F4FD1} .ch-tat{background:#B4472F} .ch-acc{background:#7B4FB8} .ch-fam{background:#23804E} .ch-bre{background:#E9B520; color:#171A2B} .ch-soc{background:#C8323A}
.res{display:inline-flex; align-items:center; gap:.18em; margin-right:.4em; font-weight:800; font-variant-numeric:tabular-nums}
.res i{font-style:normal; display:inline-grid; place-items:center; width:1.5em; height:1.5em; border-radius:.35em; color:#fff; font-size:.85em}
.res.S i,.res.C i{background:var(--designer)} .res.T i,.res.E i{background:var(--museum)}
.pp{display:inline-block; background:var(--deadline); color:var(--cardink); border-radius:.35em; padding:.02em .45em; font-weight:800; font-variant-numeric:tabular-nums}

/* welcome */
.welcome{display:grid; grid-template-columns:1.3fr 1fr; gap:2.4em; align-items:start}
.welcome h1{font-size:5.6em; line-height:.86; letter-spacing:-.05em; margin:0; font-weight:800}
.welcome h1 em{font-style:normal; color:var(--designer)}
.welcome h1 span{color:var(--deadline)}
.welcome .tagline{font-size:1.5em; color:var(--muted); margin:.5em 0 1.2em}
.count{display:flex; gap:.4em; flex-wrap:wrap}
.count button{width:2.6em; height:2.6em; border-radius:.5em; border:2px solid var(--board3); background:var(--board2); font-size:1.2em; font-weight:800}
.count button[aria-pressed="true"]{background:var(--deadline); color:var(--cardink); border-color:var(--deadline)}
.names{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.4em; margin-top:.8em}
.names input{width:100%; background:var(--board2); border:1px solid var(--board3); border-radius:.45em; padding:.35em .55em; font-size:.95em}
.qr{background:var(--card); color:var(--cardink); border-radius:14px; padding:1em; text-align:center}
.qr #qrbox{display:grid; place-items:center; min-height:200px}
.qr #qrbox img,.qr #qrbox canvas{width:min(100%,260px) !important; height:auto !important}
.qr p{margin:.5em 0 0}
.qr .url{font-weight:700; word-break:break-all; font-size:.85em}
.label{font-weight:700; margin:1.2em 0 .5em; font-size:1.1em}

/* rules */
.flow .card .n{font-size:2.2em; font-weight:800; color:var(--designer); line-height:1}
.flow .card h3{margin:.2em 0; font-size:1.15em}
.src{border-radius:10px; padding:.8em 1em}
.src.d{background:var(--designer-soft); color:var(--cardink); border:3px solid var(--designer)}
.src.m{background:var(--museum-soft); color:var(--cardink); border:3px solid var(--museum)}
.src h3{margin:0 0 .3em; font-size:1.25em}
.src.d h3{color:#4B33D6} .src.m h3{color:#0B7577}
.formula{background:var(--deadline); color:var(--cardink); border-radius:10px; padding:.8em 1em}
.formula b{display:block; font-size:1.7em; line-height:1.1}
.levels{display:flex; gap:.5em}
.levels .card{flex:1}
.levels b{display:block; font-size:2em; line-height:1}
.chips{display:flex; gap:.5em; flex-wrap:wrap; margin-top:.9em}
.chips span{border:2px solid var(--board3); border-radius:999px; padding:.3em .9em; font-weight:700}
.chips span.key{border-color:var(--deadline); color:var(--deadline)}

/* cards */
.dcard{border-top:.45em solid var(--designer)}
.mcard{border-top:.45em solid var(--museum)}
.dcard h3,.mcard h3{margin:.1em 0 .3em; font-size:1em; line-height:1.15}
.dcard .num,.mcard .num{font-size:.8em; font-weight:700}
.dcard .num{color:#4B33D6} .mcard .num{color:#0B7577}
.dcard small,.mcard small{display:block; font-size:.75em; margin-top:.3em}
.dcard,.mcard{position:relative}
.owner{position:absolute; top:.5em; right:.5em; background:var(--cardink); color:#fff; border-radius:999px; padding:.05em .55em; font-size:.75em; font-weight:800; max-width:55%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.deal{margin-top:.9em; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:.5em}
.deal .card{padding:.5em .7em; font-size:.9em}
.deal b{display:block}
.btn{border:0; border-radius:.6em; padding:.55em 1em; font-weight:800; background:var(--deadline); color:var(--cardink); font-size:1em; display:inline-flex; align-items:center; gap:.4em}
.btn.alt{background:transparent; color:var(--ink); border:2px solid var(--board3)}
.btn svg{width:1.3em; height:1.3em}
.btn:disabled{opacity:.4; cursor:not-allowed}

/* inventory */
.it{display:flex; flex-direction:column; gap:.3em; position:relative}
.it .row{display:flex; justify-content:space-between; align-items:center}
.it .k{font-size:1.8em; font-weight:800; line-height:1}
.it h3{margin:0; font-size:.98em; line-height:1.15}
.it .sub{font-size:.8em; font-style:italic}
.it .eff{font-size:.8em; font-weight:600}
.it .disc{font-size:.76em; margin-top:auto}
.it.sab{background:var(--bad-soft); outline:3px dashed var(--bad); outline-offset:-3px}
.it.sab .k{color:var(--bad)}
.rules{display:flex; flex-wrap:wrap; gap:.3em 1em; margin-top:.8em; color:var(--muted); font-size:.9em}
.rules b{color:var(--ink)}

/* close */
.phase{opacity:.4; transition:opacity .3s}
.phase.on{opacity:1; box-shadow:0 0 0 4px var(--deadline)}
.phase h3{font-size:1.5em; margin:.1em 0 .3em}
.phase p{font-size:1.15em; margin:.3em 0}
.strip{margin-top:1em; background:var(--board2); border-radius:10px; padding:.7em 1em; display:flex; flex-wrap:wrap; gap:.4em 1.2em; align-items:center}
.strip b{color:var(--deadline)}

/* draws */
.draws{display:grid; gap:.7em; grid-template-columns:repeat(var(--cols,5),minmax(0,1fr))}
.draw{min-height:9em; display:flex; flex-direction:column}
.draw .team{font-size:.85em; font-weight:800; color:var(--cardmuted)}
.draw h3{margin:.15em 0 .3em; font-size:1.08em; line-height:1.15}
.draw p{margin:0; font-size:.85em}
.draw.back{background:var(--board2); color:var(--muted); border:2px dashed var(--board3); justify-content:center; align-items:center; text-align:center}
.draw.back .q{font-size:2.6em; font-weight:800; line-height:1}
@media (prefers-reduced-motion:no-preference){ .draw.flip{animation:flip .5s cubic-bezier(.2,1.3,.4,1) both} }
@keyframes flip{from{transform:rotateY(80deg) scale(.9); opacity:0}to{transform:none; opacity:1}}
.legend{display:flex; gap:1.6em; flex-wrap:wrap; align-items:center; margin-top:.9em}
.legend b{font-size:1.6em; margin-right:.25em}
.plus{color:var(--good)} .minus{color:var(--bad)}

/* scores */
.scores{display:grid; grid-template-columns:repeat(var(--cols,5),minmax(0,1fr)); gap:.6em}
.scores label{background:var(--board2); border-radius:10px; padding:.6em .8em; display:flex; flex-direction:column; gap:.3em; font-weight:700}
.scores input{background:var(--card); color:var(--cardink); border:0; border-radius:.4em; padding:.3em .5em; font-size:1.6em; font-weight:800; width:100%; font-variant-numeric:tabular-nums}
.podium{display:grid; grid-template-columns:1fr 1.15fr 1fr; gap:.8em; align-items:end; margin-top:.4em}
.pod{background:var(--board2); border-radius:14px 14px 0 0; text-align:center; padding:1em .6em}
.pod .pl{font-size:1em; color:var(--muted); font-weight:700}
.pod .nm{font-size:1.5em; font-weight:800; line-height:1.1; margin:.2em 0}
.pod .pt{font-size:2.6em; font-weight:800; line-height:1; font-variant-numeric:tabular-nums}
.pod.p1{background:var(--deadline); color:var(--cardink); min-height:15em; display:flex; flex-direction:column; justify-content:flex-end}
.pod.p1 .pl{color:var(--cardink)}
.pod.p1 .nm{font-size:2.2em}
.pod.p1 .pt{font-size:4em}
.pod.p2{min-height:11em} .pod.p3{min-height:9em}
.pod.p2,.pod.p3{display:flex; flex-direction:column; justify-content:flex-end}
@media (prefers-reduced-motion:no-preference){ .pod{animation:rise .7s cubic-bezier(.2,1.2,.4,1) both} .pod.p3{animation-delay:.2s} .pod.p2{animation-delay:.6s} .pod.p1{animation-delay:1.1s} }
@keyframes rise{from{transform:translateY(40%); opacity:0}to{transform:none; opacity:1}}
.rest{display:flex; flex-wrap:wrap; gap:.4em 1.2em; margin-top:1em; color:var(--muted); font-size:1.05em}

/* debrief */
.lesson{display:grid; grid-template-columns:auto 1fr; gap:1em; align-items:baseline; padding:.8em 0; border-top:2px solid var(--board3)}
.lesson .n{font-size:2.8em; font-weight:800; color:var(--deadline); line-height:1}
.lesson p{margin:0; font-size:1.5em}
.lesson p b{color:var(--deadline)}
.lesson.off{opacity:.15}
.loop{display:flex; gap:.5em; flex-wrap:wrap; margin-top:1.2em}
.loop span{background:var(--board2); padding:.4em 1.1em; border-radius:999px; font-weight:800; font-size:1.2em}
.loop span:first-child{background:var(--deadline); color:var(--cardink)}

/* deadline kicker */
.kick{display:inline-block; background:var(--deadline); color:var(--cardink); font-weight:800; border-radius:999px; padding:.1em .7em; font-size:.95em; margin-bottom:.35em}
.flow .card .dl{display:block; font-weight:800; color:var(--cardmuted); font-size:.8em; margin-top:-.1em}
/* idea bulbs */
.bulbs{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1.2em; margin:.6em 0 1em}
.bulb{background:var(--board2); border-radius:16px; padding:1.2em 1em 1.1em; text-align:center}
.bulb svg{width:7em; height:auto; display:block; margin:0 auto .6em}
.bulb .halo{fill:#FFE9A8; opacity:calc(var(--glow) * .35)}
.bulb .glass{fill:#FFE38A; fill-opacity:var(--glow); stroke:#FFE7A0; stroke-width:2; stroke-opacity:calc(.35 + var(--glow) * .5)}
.bulb .fil{fill:none; stroke:#B98A1C; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; opacity:calc(.3 + var(--glow) * .7)}
.bulb .base{fill:#8C93B8}
.bulb h3{margin:0; font-size:1.6em; letter-spacing:-.01em}
.bulb .range{display:block; color:var(--muted); font-size:1.1em; margin-top:.2em}
.bulb .pts{display:inline-block; margin-top:.5em; font-size:1.3em; background:#FFE9A8; color:var(--cardink); font-weight:800; border-radius:999px; padding:.1em .8em}
@media (prefers-reduced-motion:no-preference){ .bulb:first-child .halo{animation:glow 2.4s ease-in-out infinite} }
@keyframes glow{50%{opacity:.5}}
/* project transition */
.project{min-height:60vh; display:flex; flex-direction:column; justify-content:center; align-items:flex-start}
.project .star{font-size:3em; color:var(--deadline); line-height:1}
.project h1{font-size:4.4em; line-height:.95; letter-spacing:-.04em; margin:.2em 0 .6em; font-weight:800}
.project h1 em{font-style:normal; color:var(--deadline)}
.tally{background:var(--card); color:var(--cardink); border-radius:14px; padding:1em 1.3em; display:flex; flex-direction:column; gap:.2em}
.tally b{font-size:2em; line-height:1.1}
.tally span{color:var(--cardmuted)}
.quiet{color:var(--muted); font-size:1.2em; margin-top:1em}
.pitch{margin-top:1em; background:var(--card); color:var(--cardink); border-radius:12px; padding:1em 1.2em; font-size:1.55em; font-weight:700; line-height:1.5}
.pitch u{text-decoration:none; border-bottom:3px dashed var(--designer); color:var(--designer); font-weight:600; font-size:.8em}
/* controls */
.ctrl{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 18px; background:var(--board2)}
.ctrl button{border:0; border-radius:8px; padding:8px 12px; background:var(--board3); color:var(--ink); font-weight:700; font-size:14px}
.ctrl button.primary{background:var(--deadline); color:var(--cardink)}
.ctrl button[aria-pressed="true"]{background:var(--designer); color:#fff}
.dots{display:flex; gap:5px; margin:0 auto}
.dots button{width:30px; height:30px; padding:0 !important; border-radius:50% !important; font-size:12px !important}
.dots button[aria-current="true"]{background:var(--deadline); color:var(--cardink)}
.ctrl input[type=range]{width:90px; accent-color:var(--deadline)}
.vol{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted)}
.notes{background:var(--card); color:var(--cardink); padding:14px 22px; font-size:15px; max-height:28vh; overflow:auto; border-top:4px solid var(--deadline)}
.notes h4{margin:0 0 6px}
.toast{position:fixed; left:50%; bottom:80px; transform:translateX(-50%); background:var(--card); color:var(--cardink); padding:10px 16px; border-radius:10px; font-size:14px; font-weight:600; box-shadow:0 6px 24px rgba(0,0,0,.35); max-width:90vw; z-index:30}
</style>
</head>
<body>
<header class="top">
  <div class="logo">D&amp;D<span>Designers &amp; Deadlines</span></div>
  <span class="phase-name" id="phaseName"></span>
  <button type="button" class="clock" id="session" title="Click to start or pause the session clock">Session 00:00 / 20:00</button>
</header>
<div class="tbar" id="tbar"><i></i></div>
<main class="stage" id="stage" aria-live="polite"></main>
<aside class="notes" id="notes" hidden></aside>
<nav class="ctrl" aria-label="Facilitator controls">
  <button type="button" id="prev">Back</button>
  <button type="button" id="next" class="primary">Next</button>
  <div class="dots" id="dots"></div>
  <button type="button" id="tStart" class="primary">Start timer</button>
  <button type="button" id="tAdd">+30 s</button>
  <button type="button" id="tReset">Reset</button>
  <button type="button" id="music" aria-pressed="true">Music on</button>
  <label class="vol">Volume <input type="range" id="vol" min="0" max="100" value="60" aria-label="Music volume"></label>
  <button type="button" id="tNotes" aria-pressed="false">Notes</button>
  <button type="button" id="fs">Full screen</button>
</nav>
<div class="toast" id="toast" hidden role="status"></div>

<!-- Music. Each track tries a local file first (music/...mp3 next to this page), then the Suno CDN. -->
<audio id="trk-explain" loop preload="none">
  <source src="music/explain.mp3" type="audio/mpeg">
  <source src="https://cdn1.suno.ai/34146cff-296c-4de8-a22a-c0aba38584b2.mp3" type="audio/mpeg">
</audio>
<audio id="trk-decide" loop preload="none">
  <source src="music/decision.mp3" type="audio/mpeg">
  <source src="https://cdn1.suno.ai/37c76d91-48b7-436c-b7b2-c1dfcd77e508.mp3" type="audio/mpeg">
</audio>
<audio id="trk-win" preload="none">
  <source src="music/victory.mp3" type="audio/mpeg">
  <source src="https://cdn1.suno.ai/1ff0bc3c-0b05-4b45-a715-8c97d1239d3e.mp3" type="audio/mpeg">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

];

];

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// deal n cards from a deck of size k: every card appears before any repeats
function dealDeck(k,n){ let out=[], deck=[]; while(out.length<n){ if(!deck.length) deck=shuffle([...Array(k).keys()]); out.push(deck.pop()); } return out; }

const TR={explain:$("#trk-explain"),decide:$("#trk-decide"),win:$("#trk-win")};
let musicOn=true, vol=0.6, playing=null, failed={};
Object.entries(TR).forEach(([k,a])=>{
  const srcs=a.querySelectorAll("source");
  srcs[srcs.length-1].addEventListener("error",()=>{ failed[k]=true; if(playing===k) toast("This track could not load. Add the MP3 files to a “music” folder next to index.html."); });

function fadeTo(a,target,ms,done){
  clearInterval(a._f); const start=a.volume, t0=performance.now();
  a._f=setInterval(()=>{ const k=Math.min(1,(performance.now()-t0)/ms); a.volume=Math.max(0,Math.min(1,start+(target-start)*k)); if(k>=1){ clearInterval(a._f); done&&done(); } },40);
}
function wantedTrack(){
  const s=SC[M.scene];
  if(!musicOn||!s.music) return null;
  if(s.music==="explain") return "explain";
  if(s.music==="decide") return timer.running?"decide":null;
  if(s.music==="win") return M.revealed?"win":null;
  return null;
}
function updateMusic(restartWin){
  const w=wantedTrack();
  if(playing && playing!==w){ const k=playing, a=TR[k]; fadeTo(a,0,600,()=>{ if(playing!==k) a.pause(); }); }
  if(w && (w!==playing || restartWin)){
    const a=TR[w];
    if(restartWin){ try{ a.currentTime=0; }catch(e){} }
    a.preload="auto"; a.volume=0; const p=a.play(); if(p&&p.catch) p.catch(err=>{ if(err && err.name==="NotAllowedError") toast("Press any control once to allow music in this browser."); });
    fadeTo(a,vol,900);
  }
  playing=w;
}
$("#music").addEventListener("click",e=>{ musicOn=!musicOn; e.currentTarget.textContent=musicOn?"Music on":"Music off"; e.currentTarget.setAttribute("aria-pressed",String(musicOn)); updateMusic(); });
$("#vol").addEventListener("input",e=>{ vol=e.target.value/100; if(playing) TR[playing].volume=vol; });

/* ===================== TIMER ===================== */
let actx=null;
function beep(f,d,n){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); for(let i=0;i<n;i++){ const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+i*(d+.12); o.type="square"; o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+.02);} }catch(e){} }
const timer={dur:0,left:0,running:false,end:0,b60:false,b0:false};
function resetTimer(){ const s=SC[M.scene]; timer.dur=s.dur; timer.left=s.dur; timer.running=false; timer.b60=s.dur<=60; timer.b0=false; paintTimer(); updateMusic(); }
function toggleTimer(){
  if(!SC[M.scene].dur) return;
  if(timer.running){ timer.left=Math.max(0,(timer.end-Date.now())/1000); timer.running=false; }
  else { if(timer.left<=0) resetTimer(); timer.end=Date.now()+timer.left*1000; timer.running=true; beep(660,.08,1); }
  paintTimer(); updateMusic();
}
function addTime(s){ if(!SC[M.scene].dur) return; if(timer.running) timer.end+=s*1000; else timer.left+=s; const l=timer.running?(timer.end-Date.now())/1000:timer.left; timer.dur=Math.max(timer.dur,l); if(l>60) timer.b60=false; timer.b0=false; paintTimer(); }
function paintTimer(){
  const s=SC[M.scene], bar=$("#tbar");
  ["#tStart","#tAdd","#tReset"].forEach(id=>$(id).disabled=!s.dur);
  $("#tStart").textContent=timer.running?"Pause timer":"Start timer";
  if(!s.dur){ bar.firstElementChild.style.transform="scaleX(0)"; bar.classList.remove("hot"); return; }
  const left=timer.running?Math.max(0,(timer.end-Date.now())/1000):timer.left;
  bar.firstElementChild.style.transform=`scaleX(${timer.dur?left/timer.dur:0})`;
  const hot=left>0&&left<=10, done=left<=0;
  bar.classList.toggle("hot",hot||done);
  const box=$("#tbox"); if(box){ $("#tdig").textContent=fmt(left); box.classList.toggle("hot",hot&&timer.running); box.classList.toggle("done",done); $("#tlab").textContent=done?"Time’s up":timer.running?(s.label||"Timer"):"Ready"; }
  if(M.scene===4){ const half=timer.dur/2, a=$("#ph1"),b=$("#ph2"); if(a&&b){ a.classList.toggle("on",left>half); b.classList.toggle("on",left<=half); } }
}
setInterval(()=>{
  if(timer.running){
    const left=(timer.end-Date.now())/1000;
    if(!timer.b60 && left<=60 && timer.dur>60){ timer.b60=true; beep(880,.15,2); }
    if(left<=0){ timer.running=false; timer.left=0; if(!timer.b0){ timer.b0=true; beep(440,.4,3); } updateMusic(); }
    paintTimer();
  }
  paintSession();
},200);

/* session clock */
const sess={acc:0,start:0,on:false};
function paintSession(){ const ms=sess.acc+(sess.on?Date.now()-sess.start:0), s=Math.floor(ms/1000); $("#session").textContent=`Session ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")} / 20:00`; }
function sessSet(on){ if(on===sess.on) return; if(on){ sess.start=Date.now(); sess.on=true; } else { sess.acc+=Date.now()-sess.start; sess.on=false; } }
$("#session").addEventListener("click",()=>sessSet(!sess.on));

/* ===================== RENDER / NAV ===================== */
function render(){
  const s=SC[M.scene];
  $("#stage").innerHTML=R[M.scene](M.rev[M.scene]||0);
  $("#phaseName").textContent=s.name;
  $("#dots").innerHTML=SC.map((x,i)=>`<button type="button" data-go="${i}" title="${x.name}" aria-label="${x.name}" ${i===M.scene?'aria-current="true"':""}>${i+1}</button>`).join("");
  $("#notes").innerHTML=`<h4>${s.name} <span style="color:var(--cardmuted);font-weight:500">${s.when}</span></h4>${esc(s.notes)}`;
  if(M.scene===0) drawQR();
  paintTimer();
  M._flipS=false; M._flipV=false;
}
function go(i){ if(i<0||i>=SC.length) return; if(M.scene===0&&i>0) sessSet(true); M.scene=i; save(); resetTimer(); render(); }
function next(){ const s=SC[M.scene], r=M.rev[M.scene]||0; if(r<s.steps){ M.rev[M.scene]=r+1; save(); render(); } else go(M.scene+1); }
function prev(){ const r=M.rev[M.scene]||0; if(r>0){ M.rev[M.scene]=r-1; save(); render(); } else go(M.scene-1); }

function teamURL(){ try{ return new URL("team.html",location.href).href; }catch(e){ return "team.html"; } }
function drawQR(){
  const box=$("#qrbox"), url=teamURL(); if(!box) return;
  $("#qrurl").textContent=url.replace(/^https?:\/\//,"");
  box.innerHTML="";
  if(window.QRCode){ try{ new QRCode(box,{text:url,width:260,height:260,colorDark:"#171A2B",colorLight:"#FFFFFF",correctLevel:QRCode.CorrectLevel.M}); return; }catch(e){} }
  box.innerHTML=`<p class="muted">The QR code needs an internet connection. Share the address below instead.</p>`;
}

$("#next").addEventListener("click",next);
$("#prev").addEventListener("click",prev);
$("#dots").addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(b) go(+b.dataset.go); });
$("#tStart").addEventListener("click",toggleTimer);
$("#tAdd").addEventListener("click",()=>addTime(30));
$("#tReset").addEventListener("click",resetTimer);
$("#tNotes").addEventListener("click",e=>{ const n=$("#notes"); n.hidden=!n.hidden; e.currentTarget.setAttribute("aria-pressed",String(!n.hidden)); });
$("#fs").addEventListener("click",()=>{ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }catch(e){} });

$("#stage").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.count){ M.n=+b.dataset.count; M.deal=null; M.setbacks=null; M.visitors=null; M.revealed=false; save(); render(); }
  else if(b.hasAttribute("data-deal")){ const d=shuffle([...Array(10).keys()]), m=shuffle([...Array(10).keys()]); M.deal=Array.from({length:M.n},(_,i)=>({d:d[i],m:m[i]})); save(); render(); beep(520,.06,3); }
  else if(b.hasAttribute("data-undeal")){ M.deal=null; save(); render(); }
  else if(b.hasAttribute("data-draw-setbacks")){ if(M.setbacks && !confirm("Draw new setbacks for every team?")) return; M.setbacks=dealDeck(SETBACKS.length,M.n); M._flipS=true; save(); render(); beep(520,.06,3); }
  else if(b.hasAttribute("data-draw-visitors")){ if(M.visitors && !confirm("Draw new testers for every team?")) return; M.visitors=dealDeck(TESTERS.length,M.n); M._flipV=true; save(); render(); beep(520,.06,3); }
  else if(b.hasAttribute("data-reveal")){ M.revealed=true; save(); render(); updateMusic(true); }
  else if(b.hasAttribute("data-unreveal")){ M.revealed=false; save(); render(); updateMusic(); }
  else if(b.hasAttribute("data-replay")){ updateMusic(true); }
});
$("#stage").addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.name!==undefined){ M.names[+t.dataset.name]=t.value; save(); }
  else if(t.dataset.score!==undefined){ M.scores[+t.dataset.score]=t.value; save(); }
});
document.addEventListener("keydown",e=>{
  const t=e.target; if(t && (t.isContentEditable || /INPUT|SELECT|TEXTAREA/.test(t.tagName))) return;
  if(["ArrowRight","PageDown"," "].includes(e.key)){ e.preventDefault(); next(); }
  else if(["ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==="t"||e.key==="T") toggleTimer();
  else if(e.key==="r"||e.key==="R") resetTimer();
  else if(e.key==="n"||e.key==="N") $("#tNotes").click();
  else if(e.key==="m"||e.key==="M") $("#music").click();
});

/* ===================== START ===================== */
resetTimer(); render(); paintSession();
})();
</script>
</body>
</html>
